---
- name: Tune system swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-swappiness.conf
    sysctl_set: true
    reload: true

- name: Perform a dist upgrade
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: full

- name: "Enable passwordless sudo for user {{ local_username }}"
  ansible.builtin.user:
    name: "{{ local_username }}"
    groups: kali-trusted
    append: true

- name: Set system time to UTC
  community.general.timezone:
    name: Etc/UTC

- name: Install some recommended additional packages
  ansible.builtin.apt:
    pkg: "{{ base_system_packages }}"
    state: present

- name: Process wordlists
  block:
    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto
      no_log: true

    - name: Create symlink to seclists from wordlists dir
      ansible.builtin.file:
        src: /usr/share/seclists
        dest: /usr/share/wordlists/seclists
        state: link
      when: "'seclists' in ansible_facts.packages"

    - name: Extract rockyou.txt.gz wordlist
      ansible.builtin.command:
        cmd: gunzip --keep /usr/share/wordlists/rockyou.txt.gz
        creates: /usr/share/wordlists/rockyou.txt
      when: "'wordlists' in ansible_facts.packages"

- name: Setup anonymous browsing capability
  block:
    - name: Install tor and proxychains
      ansible.builtin.apt:
        pkg:
          - tor
          - proxychains4

    - name: Copy torrc file
      ansible.builtin.copy:
        src: etc/tor/torrc
        dest: /etc/tor/torrc
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Ensure tor service runs on system startup
      ansible.builtin.systemd:
        name: tor
        state: started
        enabled: true

    - name: Copy proxychains4 config file
      ansible.builtin.copy:
        src: etc/proxychains4.conf
        dest: /etc/proxychains4.conf
        owner: root
        group: root
        mode: '0644'
        backup: true

- name: Configure mitmproxy CA certificate
  block:
    - name: Run mitmdump to generate CA certificates
      ansible.builtin.shell: "timeout 5s mitmdump > /dev/null 2>&1 || true"
      become: true
      become_user: "{{ local_username }}"
      args:
        creates: "/home/{{ local_username }}/.mitmproxy/mitmproxy-ca-cert.pem"

    - name: Copy mitmproxy CA certificate to system store
      ansible.builtin.copy:
        src: "/home/{{ local_username }}/.mitmproxy/mitmproxy-ca-cert.pem"
        dest: "/usr/local/share/ca-certificates/mitmproxy.crt"
        mode: '0644'
        owner: root
        group: root
        remote_src: true
      notify: Update CA certificates

- name: Install Docker packages
  ansible.builtin.apt:
    pkg: "{{ base_docker_packages }}"
    state: present

- name: Ensure Docker is running and enabled on startup
  ansible.builtin.systemd:
    name: "{{ base_docker_service_name }}"
    state: started
    enabled: true

- name: Make local user able to run docker commands
  ansible.builtin.user:
    name: "{{ local_username }}"
    append: true
    groups:
      - docker

# pipx binaries break when Python is upgraded, so rebuild every package
# against the current interpreter. pipx uninstall-all removes only pipx's
# own venvs and shims, leaving anything else in ~/.local/bin untouched.
- name: Install pipx packages
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Remove pipx-managed packages for a clean rebuild
      ansible.builtin.command: pipx uninstall-all
      register: base_pipx_uninstall_all
      changed_when: base_pipx_uninstall_all.stdout | trim | length > 0

    - name: Install the pipx packages
      community.general.pipx:
        name: "{{ item }}"
        python: /usr/bin/python3
      loop: "{{ base_pipx_packages }}"

- name: Install projectdiscovery.io OSS tools
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Create projectdiscovery temporary directory for extraction
      ansible.builtin.file:
        path: /tmp/projectdiscovery
        state: directory
        mode: '0755'

    - name: Get host architecture
      ansible.builtin.command: dpkg --print-architecture
      register: base_host_architecture
      changed_when: false

    - name: Set architecture fact
      ansible.builtin.set_fact:
        base_cpu_arch: "{{ base_host_architecture.stdout }}"

    - name: Get latest release information for pdtm
      ansible.builtin.uri:
        url: "{{ base_pdtm_latest_release_url }}"
        return_content: true
      register: base_pdtm_latest_release

    - name: Extract pdtm version from the latest release URL
      ansible.builtin.set_fact:
        base_pdtm_version: >-
          {{ base_pdtm_latest_release.json.tag_name
             | regex_replace('^v', '') }}

    - name: Extract download URL for pdtm
      ansible.builtin.set_fact:
        base_pdtm_download_url: >-
          {{ base_pdtm_latest_release.json.assets
             | selectattr('name', 'match',
                          '^pdtm_' ~ base_pdtm_version
                          ~ '_linux_' ~ base_cpu_arch ~ '.zip$')
             | map(attribute='browser_download_url')
             | first }}

    - name: Download pdtm file
      ansible.builtin.get_url:
        url: "{{ base_pdtm_download_url }}"
        mode: '0644'
        dest: >-
          {{ '/tmp/projectdiscovery/pdtm_' ~ base_pdtm_version
             ~ '_linux_' ~ base_cpu_arch ~ '.zip' }}

    - name: Unzip pdtm file
      ansible.builtin.unarchive:
        src: >-
          {{ '/tmp/projectdiscovery/pdtm_' ~ base_pdtm_version
             ~ '_linux_' ~ base_cpu_arch ~ '.zip' }}
        dest: /tmp/projectdiscovery
        remote_src: true

    # Also appends ~/.pdtm/go/bin to PATH in ~/.zshrc
    - name: Execute pdtm file
      ansible.builtin.command:
        cmd: "/tmp/projectdiscovery/pdtm -i pdtm"
        creates: "/home/{{ local_username }}/.pdtm/go/bin/pdtm"

    - name: Remove projectdiscovery.io temporary download directory
      ansible.builtin.file:
        path: /tmp/projectdiscovery
        state: absent

    - name: Install all other projectdiscovery.io tools
      ansible.builtin.command:
        cmd: "/home/{{ local_username }}/.pdtm/go/bin/pdtm -i {{ item }}"
        creates: "/home/{{ local_username }}/.pdtm/go/bin/{{ item }}"
      loop: "{{ base_projectdiscovery_tools }}"

    - name: Update all projectdiscovery.io tools
      ansible.builtin.command: >-
        /home/{{ local_username }}/.pdtm/go/bin/pdtm -update-all
      register: base_pdtm_update
      changed_when:
        - "'updating' in (base_pdtm_update.stdout ~ base_pdtm_update.stderr) | lower"
        - "'updated' in (base_pdtm_update.stdout ~ base_pdtm_update.stderr) | lower"

- name: Install VSCodium and some plugins
  block:
    - name: Add VSCodium repo (deb822 format)
      ansible.builtin.deb822_repository:
        name: "{{ base_vscodium.repo_filename }}"
        types: deb
        architectures: "{{ base_vscodium.architectures }}"
        uris: "{{ base_vscodium.uris }}"
        suites: "{{ base_vscodium.suites }}"
        components: "{{ base_vscodium.components }}"
        signed_by: "{{ base_vscodium.apt_key_url }}"
        state: present

    - name: Install the latest version of VSCodium
      ansible.builtin.apt:
        name: "{{ base_vscodium.package }}"
        update_cache: true
        cache_valid_time: 0

    - name: Install some VSCodium extensions
      ansible.builtin.command: >-
        codium --install-extension {{ item }}
      loop: "{{ base_vscodium.extensions }}"
      loop_control:
        pause: 1  # slow down installs to avoid rate limiting
      become: true
      become_user: "{{ local_username }}"
      register: base_codium_extension
      async: 120
      poll: 2
      retries: 5
      delay: 5
      until: base_codium_extension is not failed
      changed_when: >-
        'successfully installed' in
        (((base_codium_extension.stdout | default('')) ~ ' ' ~
          (base_codium_extension.stderr | default(''))) | lower)
      failed_when: >-
        base_codium_extension.rc | default(1) != 0
        and 'already installed' not in
        (((base_codium_extension.stdout | default('')) ~ ' ' ~
          (base_codium_extension.stderr | default(''))) | lower)

- name: Build and install Rust binaries using cargo
  community.general.cargo:
    name: "{{ item }}"
    locked: true
    state: latest
  loop: "{{ base_cargo_packages }}"
  become: true
  become_user: "{{ local_username }}"

- name: Build and install Go binaries
  ansible.builtin.command: "go install {{ item }}"
  changed_when: true
  loop: "{{ base_golang_packages }}"
  become: true
  become_user: "{{ local_username }}"

- name: Get an offline copy of all tldr pages
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -i
      - -c
      - tldr --update
  changed_when: true
  become: true
  become_user: "{{ local_username }}"

# Fix for bat syntax highlighting tool; Debian packages it as batcat instead
# of just bat
- name: Create symlink for bat
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link
    force: true

- name: Clone some git repositories
  block:
    - name: Create base dir for privesc scripts
      ansible.builtin.file:
        path: /opt/privesc-scripts
        state: directory
        mode: '0775'

    - name: Create symlink from /usr/share
      ansible.builtin.file:
        src: /opt/privesc-scripts
        dest: /usr/share/privesc-scripts
        state: link

    - name: Git clone tools
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        version: "{{ item.version | default('HEAD') }}"
        depth: "{{ item.depth | default(omit) }}"
        force: true
      loop: "{{ base_git_repos }}"

- name: Setup tmux
  block:
    - name: Install packages needed for tmux
      ansible.builtin.apt:
        pkg:
          - tmux
          - xsel

    - name: Git clone tmux plugin repo
      ansible.builtin.git:
        repo: "{{ base_tmux_tpm_repo_url }}"
        dest: "/home/{{ local_username }}/.tmux/plugins/tpm"
        clone: true
        version: master
      become: true
      become_user: "{{ local_username }}"

    - name: Copy sample .tmux.conf file to the user's homedir
      ansible.builtin.copy:
        src: home/user/.tmux.conf
        dest: "/home/{{ local_username }}/.tmux.conf"
        mode: '0644'
      become: true
      become_user: "{{ local_username }}"

    - name: Install all required tmux plugins
      ansible.builtin.command:
        cmd: >-
          {{ '/home/' ~ local_username
             ~ '/.tmux/plugins/tpm/scripts/install_plugins.sh' }}
        creates: >-
          /home/{{ local_username }}/.tmux/plugins/tmux-sensible
      become: true
      become_user: "{{ local_username }}"

- name: Setup custom fonts
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Create local fonts directory
      ansible.builtin.file:
        path: "/home/{{ local_username }}/.local/share/fonts"
        mode: '0755'
        state: directory

    - name: Download nerd fonts to local fonts folder
      ansible.builtin.get_url:
        url: "{{ base_nerd_fonts_download_base_url }}/{{ item }}"
        dest: >-
          /home/{{ local_username }}/.local/share/fonts/{{ item | basename }}
        mode: '0644'
        timeout: 20  # GitHub raw can be slow; avoid 10s default timeout
      register: base_nerd_font_downloads
      retries: 5
      delay: 5
      until: base_nerd_font_downloads is not failed
      loop: "{{ base_nerd_fonts }}"
      loop_control:
        pause: 1  # slow down downloads to avoid server overload
      notify: Refresh fonts cache

- name: Setup some essential paths
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Set bin path for rust/cargo, pipx, and golang
      ansible.builtin.blockinfile:
        path: "/home/{{ local_username }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - bin paths"
        block: |
          # rust binaries installed using cargo
          export PATH="$PATH:/home/{{ local_username }}/.cargo/bin"

          # golang binaries
          export PATH="$PATH:/home/{{ local_username }}/go/bin"

          # pipx binaries
          export PATH="$PATH:/home/{{ local_username }}/.local/bin"
        create: true
        mode: '0644'

- name: Generate ssh keys
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ local_username }}/.ssh"
        state: directory
        mode: '0700'

    - name: Generate RSA SSH key pair
      community.crypto.openssh_keypair:
        state: present
        type: rsa
        size: 4096
        path: "/home/{{ local_username }}/.ssh/id_rsa"

    - name: Generate Ed25519 SSH key pair
      community.crypto.openssh_keypair:
        state: present
        type: ed25519
        path: "/home/{{ local_username }}/.ssh/id_ed25519"

- name: Setup custom shell aliases and functions
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Copy sample .shell_*.sh files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "~{{ local_username }}/{{ item | basename }}"
        mode: '0644'
      loop:
        - home/user/.shell_aliases.sh
        - home/user/.shell_functions.sh
        - home/user/.shell_variables.sh

    - name: Include .shell_*.sh files in .zshrc
      ansible.builtin.blockinfile:
        path: "/home/{{ local_username }}/.zshrc"
        marker: >-
          # {mark} ANSIBLE MANAGED BLOCK - extra shell functions and aliases
        block: |
          [[ -f ~/.shell_aliases.sh ]] && source ~/.shell_aliases.sh
          [[ -f ~/.shell_functions.sh ]] && source ~/.shell_functions.sh
          [[ -f ~/.shell_variables.sh ]] && source ~/.shell_variables.sh
        create: true
        mode: '0644'

- name: Setup alacritty
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Create alacritty config directory
      ansible.builtin.file:
        path: "/home/{{ local_username }}/.config/alacritty"
        state: directory
        mode: '0755'
        owner: "{{ local_username }}"
        group: "{{ local_username }}"

    - name: Clone alacritty themes git repo
      ansible.builtin.git:
        repo: "{{ base_alacritty_themes_repo_url }}"
        dest: "~{{ local_username }}/.config/alacritty/themes"
        clone: true
        version: master

    - name: Copy sample alacritty config file
      ansible.builtin.copy:
        src: home/user/.config/alacritty/alacritty.toml
        dest: "/home/{{ local_username }}/.config/alacritty/alacritty.toml"
        mode: '0644'

- name: Set up Neovim starter configuration
  become: true
  become_user: "{{ local_username }}"
  block:
    - name: Clone lazyvim starter git repo
      ansible.builtin.git:
        repo: "{{ base_lazyvim_starter_repo_url }}"
        dest: "/home/{{ local_username }}/.config/nvim"
        version: main

- name: Initialize zoxide and fzf in zsh shell
  become: true
  become_user: "{{ local_username }}"
  ansible.builtin.blockinfile:
    path: "/home/{{ local_username }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - shell tool init"
    block: |
      # initialize zoxide
      eval "$(zoxide init zsh)"

      # Set up fzf key bindings and fuzzy completion
      source <(fzf --zsh)
    create: true
    mode: '0644'

- name: Final cleanup
  block:
    - name: Cleanup apt packages and repodata
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
